name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest requests
      - run: pytest tests/test_answer_format.py tests/test_sandbox.py -q
      - run: python3 scripts/selftest.py
