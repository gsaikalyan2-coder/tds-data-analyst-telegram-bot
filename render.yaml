services:
  - type: web
    name: tds-data-analyst-bot
    runtime: python
    plan: starter          # free tier sleeps; starter stays warm during grading
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: logs
      mountPath: /opt/render/project/src/logs
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: LLM_BASE_URL
        value: https://aipipe.org/openai/v1
      - key: LLM_MODEL
        value: gpt-4.1-mini
      - key: USE_WEBHOOK
        value: "true"
      - key: TURN_DEADLINE_SECONDS
        value: "150"
      - key: LOG_DIR
        value: /opt/render/project/src/logs
