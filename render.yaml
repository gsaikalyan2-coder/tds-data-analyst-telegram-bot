services:
  - type: web
    name: tds-data-analyst-bot
    runtime: python
    # FREE tier: no card required. Trade-offs vs `starter`:
    #   * spins down after ~15 min idle (cold start ~50s) -> keep-alive ping
    #   * 512 MB RAM -> requirements.txt is kept lean
    #   * no persistent disk -> logs live on the ephemeral filesystem and are
    #     recreated at boot by ensure_log_files(), so /run.jsonl is never a 404
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: LLM_BASE_URL
        value: https://aipipe.org/openai/v1
      - key: LLM_MODEL
        value: gpt-4.1-mini
      - key: USE_WEBHOOK
        value: "true"
      # Free instances are slower and cold-start; leave headroom inside the
      # grader's 300s whole-exchange budget.
      - key: TURN_DEADLINE_SECONDS
        value: "120"
      - key: MAX_TOOL_CALLS
        value: "18"
      # Relative path -> resolved against the project root by config.py.
      - key: LOG_DIR
        value: logs
